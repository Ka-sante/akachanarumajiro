<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東京都の学校施設マップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Yu Gothic", "Meiryo", sans-serif; color: #243042; background: #f4f6f8; }
    header { padding: 16px 22px; background: #fff; border-bottom: 1px solid #dce2e8; }
    h1 { margin: 0 0 5px; font-size: 21px; }
    .subtitle { color: #64748b; font-size: 13px; }
    .layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); height: calc(100vh - 72px); min-height: 520px; }
    aside { padding: 16px; overflow-y: auto; background: #fff; border-right: 1px solid #dce2e8; }
    #map { width: 100%; height: 100%; min-height: 520px; }
    .section { margin-bottom: 20px; }
    .section h2 { margin: 0 0 10px; font-size: 15px; }
    .summary { padding: 12px; border-radius: 9px; background: #f1f5f9; }
    .summary strong { display: block; font-size: 25px; }
    .summary span { color: #64748b; font-size: 12px; }
    input[type="search"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 7px; font-size: 14px; }
    .filters { display: grid; gap: 8px; }
    .filter { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .filter input { accent-color: #2563eb; }
    .count { margin-left: auto; color: #64748b; font-variant-numeric: tabular-nums; }
    button { padding: 8px 11px; border: 1px solid #cbd5e1; border-radius: 7px; background: #fff; cursor: pointer; }
    button:hover { background: #eff6ff; }
    .buttons { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .note { color: #64748b; font-size: 12px; line-height: 1.6; }
    .status { margin-top: 12px; padding: 10px; border-radius: 7px; background: #eff6ff; color: #1d4ed8; font-size: 13px; }
    .error { background: #fef2f2; color: #b91c1c; }
    .leaflet-popup-content { line-height: 1.65; min-width: 210px; }
    .popup-name { font-weight: 700; font-size: 14px; margin-bottom: 5px; }
    .popup-label { color: #64748b; }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: auto minmax(430px, 1fr); height: auto; }
      aside { border-right: 0; border-bottom: 1px solid #dce2e8; max-height: none; }
      #map { height: 65vh; min-height: 430px; }
      .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
<header>
  <h1>東京都の学校施設マップ</h1>
  <div class="subtitle">GeoJSON内の学校施設を地図上に表示します。マーカーを選択すると施設情報を確認できます。</div>
</header>
<div class="layout">
  <aside>
    <section class="section">
      <h2>データ概要</h2>
      <div class="summary"><strong id="totalCount">読み込み中</strong><span>GeoJSON内の施設数</span></div>
      <div class="status" id="status">GeoJSONファイルを読み込んでいます…</div>
    </section>
    <section class="section">
      <h2>施設を検索</h2>
      <input id="search" type="search" placeholder="学校名・住所を入力">
    </section>
    <section class="section">
      <h2>学校種別で絞り込む</h2>
      <div class="filters" id="filters"></div>
      <div class="buttons">
        <button id="selectAll">すべて選択</button>
        <button id="clearAll">すべて解除</button>
      </div>
    </section>
    <section class="section">
      <h2>表示状況</h2>
      <div class="note" id="shownCount">表示中：-</div>
      <div class="buttons">
        <button id="showAll">全施設が見える範囲に移動</button>
      </div>
    </section>
    <section class="section">
      <h2>使い方</h2>
      <div class="note">
        ・地図上の円または数字をクリックすると施設情報が表示されます。<br>
        ・地図を拡大すると、重なっていた施設が個別に表示されます。<br>
        ・学校種別や検索語を指定して、表示する施設を絞り込めます。<br>
        ・地図データの表示にはインターネット接続が必要です。
      </div>
    </section>
  </aside>
  <main id="map"></main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
(() => {
  "use strict";

  const GEOJSON_FILE = "P29-23_13.geojson";
  const categoryNames = {
    "16001": "小学校", "16002": "中学校", "16003": "中等教育学校",
    "16004": "高等学校", "16005": "高等専門学校", "16006": "短期大学",
    "16007": "大学", "16011": "幼稚園", "16012": "特別支援学校",
    "16013": "幼保連携認定こども園", "16014": "義務教育学校",
    "16015": "各種学校", "16016": "専修学校"
  };

  // 学校種別コードごとのマーカー色
  const categoryColors = {
    "16001": "#2563eb", // 小学校：青
    "16002": "#16a34a", // 中学校：緑
    "16003": "#9333ea", // 中等教育学校：紫
    "16004": "#ea580c", // 高等学校：オレンジ
    "16005": "#0891b2", // 高等専門学校：シアン
    "16006": "#db2777", // 短期大学：ピンク
    "16007": "#dc2626", // 大学：赤
    "16011": "#ca8a04", // 幼稚園：黄土色
    "16012": "#4f46e5", // 特別支援学校：藍色
    "16013": "#0d9488", // 幼保連携認定こども園：青緑
    "16014": "#7c3aed", // 義務教育学校：紫
    "16015": "#a16207", // 各種学校：茶色
    "16016": "#64748b"  // 専修学校：グレー
  };

  const map = L.map("map").setView([35.68, 139.75], 10);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  const cluster = L.markerClusterGroup({
    showCoverageOnHover: false,
    spiderfyOnMaxZoom: true,
    chunkedLoading: true,
    maxClusterRadius: 55
  });
  map.addLayer(cluster);

  let features = [];
  let markers = [];
  let categoryCounts = {};

  const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[ch]);

  function popupHtml(p) {
    const code = String(p.P29_003 ?? "");
    const kind = categoryNames[code] || "分類不明（コード：" + code + "）";
    return `<div class="popup-name">${esc(p.P29_004 || "名称不明")}</div>
      <div><span class="popup-label">学校種別：</span>${esc(kind)}</div>
      <div><span class="popup-label">住所：</span>${esc(p.P29_005 || "記載なし")}</div>
      <div><span class="popup-label">行政区域コード：</span>${esc(p.P29_001 || "記載なし")}</div>
      <div><span class="popup-label">学校コード：</span>${esc(p.P29_002 || "記載なし")}</div>
      <div><span class="popup-label">管理者コード：</span>${esc(p.P29_006 || "記載なし")}</div>
      <div><span class="popup-label">休校区分：</span>${esc(p.P29_007 || "記載なし")}</div>
      ${p.P29_009 ? `<div><span class="popup-label">備考：</span>${esc(p.P29_009)}</div>` : ""}`;
  }

  function buildFilters() {
    const root = document.getElementById("filters");
    root.innerHTML = "";
    Object.entries(categoryNames).forEach(([code, name]) => {
      const label = document.createElement("label");
      label.className = "filter";
      const input = document.createElement("input");
      input.type = "checkbox";
      input.checked = true;
      input.dataset.code = code;
      input.addEventListener("change", renderMarkers);
      const swatch = document.createElement("span");
      swatch.style.cssText = `display:inline-block;width:11px;height:11px;border-radius:50%;background:${categoryColors[code] || "#6b7280"};border:1px solid #cbd5e1;flex:0 0 11px;`;
      const text = document.createElement("span");
      text.textContent = name;
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = categoryCounts[code] || 0;
      label.append(input, swatch, text, count);
      root.appendChild(label);
    });
  }

  function renderMarkers() {
    const selected = new Set(
      [...document.querySelectorAll("#filters input:checked")].map(el => el.dataset.code)
    );
    const keyword = document.getElementById("search").value.trim().toLocaleLowerCase();
    cluster.clearLayers();
    const visible = [];

    markers.forEach(item => {
      const p = item.feature.properties || {};
      const code = String(p.P29_003 ?? "");
      const searchable = `${p.P29_004 || ""} ${p.P29_005 || ""}`.toLocaleLowerCase();
      if (selected.has(code) && (!keyword || searchable.includes(keyword))) {
        visible.push(item.marker);
      }
    });
    cluster.addLayers(visible);
    document.getElementById("shownCount").textContent =
      `表示中：${visible.length.toLocaleString()} / ${features.length.toLocaleString()} 件`;
  }

  document.getElementById("search").addEventListener("input", renderMarkers);
  document.getElementById("selectAll").addEventListener("click", () => {
    document.querySelectorAll("#filters input").forEach(el => el.checked = true);
    renderMarkers();
  });
  document.getElementById("clearAll").addEventListener("click", () => {
    document.querySelectorAll("#filters input").forEach(el => el.checked = false);
    renderMarkers();
  });
  document.getElementById("showAll").addEventListener("click", () => {
    const visible = [];
    const selected = new Set([...document.querySelectorAll("#filters input:checked")].map(el => el.dataset.code));
    const keyword = document.getElementById("search").value.trim().toLocaleLowerCase();
    markers.forEach(item => {
      const p = item.feature.properties || {};
      if (selected.has(String(p.P29_003 ?? "")) &&
          (!keyword || `${p.P29_004 || ""} ${p.P29_005 || ""}`.toLocaleLowerCase().includes(keyword))) {
        visible.push(item.marker);
      }
    });
    if (visible.length) map.fitBounds(L.featureGroup(visible).getBounds().pad(0.06), { maxZoom: 13 });
  });

  async function loadData() {
    try {
      if (typeof L === "undefined") throw new Error("地図ライブラリを読み込めません。インターネット接続を確認してください。");
      const response = await fetch(GEOJSON_FILE);
      if (!response.ok) throw new Error(`${GEOJSON_FILE} を読み込めません（HTTP ${response.status}）。HTMLとGeoJSONを同じフォルダに置いてください。`);
      const geojson = await response.json();
      if (geojson.type !== "FeatureCollection" || !Array.isArray(geojson.features)) {
        throw new Error("GeoJSONの形式がFeatureCollectionではありません。");
      }
      features = geojson.features;
      categoryCounts = {};
      features.forEach(feature => {
        const code = String(feature.properties?.P29_003 ?? "");
        categoryCounts[code] = (categoryCounts[code] || 0) + 1;
      });

      markers = [];
      features.forEach(feature => {
        const coords = feature.geometry?.coordinates;
        if (!coords || feature.geometry.type !== "Point" ||
            !Number.isFinite(Number(coords[0])) || !Number.isFinite(Number(coords[1]))) return;

        // GeoJSONの座標順は [経度, 緯度]。Leafletには [緯度, 経度] で渡す。
        const code = String(feature.properties?.P29_003 ?? "");
        const markerColor = categoryColors[code] || "#6b7280";
        const marker = L.circleMarker([Number(coords[1]), Number(coords[0])], {
          radius: 5, color: "#ffffff", weight: 1,
          fillColor: markerColor, fillOpacity: 0.88
        }).bindPopup(popupHtml(feature.properties || {}));
        markers.push({ feature, marker });
      });

      document.getElementById("totalCount").textContent = features.length.toLocaleString() + " 件";
      buildFilters();
      renderMarkers();
      const bounds = L.featureGroup(markers.map(item => item.marker)).getBounds();
      if (bounds.isValid()) map.fitBounds(bounds.pad(0.04));
      document.getElementById("status").textContent =
        `読み込み完了：${features.length.toLocaleString()}件（地図に表示できるPoint：${markers.length.toLocaleString()}件）`;
    } catch (error) {
      const status = document.getElementById("status");
      status.className = "status error";
      status.textContent = error.message +
        " file:// で直接開いている場合は、下記の手順でローカルサーバーを起動してください。";
      document.getElementById("totalCount").textContent = "読込失敗";
    }
  }

  loadData();
})();
</script>
</body>
</html>
